<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MiniCloud Applications</title>
  <style>
    :root {
      color-scheme: light;
      --page: #f5f7fb;
      --surface: #ffffff;
      --text: #1e293b;
      --muted: #64748b;
      --border: #dfe5ee;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --radius: 12px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html { min-height: 100%; background: var(--page); }
    body {
      max-width: 1120px;
      margin: 0 auto;
      padding: 40px 24px 56px;
      color: var(--text);
      font-size: 15px;
      line-height: 1.6;
    }

    h1, h2, h3 { color: #0f172a; font-weight: 650; line-height: 1.3; }
    h1 { margin: 0 0 8px; font-size: 32px; letter-spacing: -1px; }
    body > p { margin: 0 0 32px; color: var(--muted); }
    h2 { margin: 28px 0 12px; font-size: 18px; letter-spacing: -.2px; }
    h3 { margin: 0 0 16px; font-size: 18px; overflow-wrap: anywhere; }

    form, article, pre {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: 0 2px 6px rgb(15 23 42 / 3%);
    }
    form {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 18px;
      align-items: end;
      margin: 0 0 24px;
      padding: 24px;
    }
    label { display: grid; min-width: 0; gap: 7px; color: #475569; font-size: 13px; font-weight: 600; }
    input, button { min-height: 42px; border-radius: 7px; font: inherit; }
    input {
      width: 100%;
      min-width: 0;
      padding: 9px 12px;
      border: 1px solid #cbd5e1;
      background: #fff;
      color: var(--text);
      font-size: 14px;
      font-weight: 400;
      transition: border-color .15s, box-shadow .15s;
    }
    input::placeholder { color: #64748b; opacity: 1; }
    input:hover { border-color: #94a3b8; }
    input:focus { border-color: var(--primary); outline: 0; box-shadow: 0 0 0 3px rgb(37 99 235 / 14%); }

    button {
      padding: 9px 14px;
      border: 1px solid #cbd5e1;
      background: #fff;
      color: #334155;
      font-size: 13px;
      font-weight: 600;
      line-height: 1.4;
      cursor: pointer;
      transition: background-color .15s, border-color .15s, color .15s;
    }
    button:hover { background: #f1f5f9; border-color: #94a3b8; }
    button:active { background: #e2e8f0; }
    button:focus-visible { outline: 3px solid rgb(37 99 235 / 35%); outline-offset: 3px; }
    form button, button[data-action="deploy"] { background: var(--primary); border-color: var(--primary); color: #fff; }
    form button:hover, button[data-action="deploy"]:hover { background: var(--primary-hover); border-color: var(--primary-hover); }
    button[data-delete] { color: #b91c1c; border-color: #fecaca; background: #fff; }
    button[data-delete]:hover { background: #fef2f2; border-color: #f87171; }
    button:disabled { opacity: .55; cursor: wait; }

    .apps { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-top: 32px; }
    article { display: flex; flex-direction: column; min-width: 0; padding: 24px; }
    .meta { margin-bottom: 20px; color: var(--muted); font-size: 13px; line-height: 1.9; overflow-wrap: anywhere; }
    code { padding: 2px 5px; border-radius: 4px; background: #f1f5f9; color: #334155; font-size: 12px; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; margin: auto 0 0; padding-top: 16px; border-top: 1px solid #edf0f5; }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 2px 9px;
      border: 1px solid #dfe5ee;
      border-radius: 999px;
      background: #f1f5f9;
      color: #475569;
      font-size: 12px;
      font-weight: 600;
      line-height: 1.6;
      vertical-align: middle;
    }
    .status::before { content: ""; width: 6px; height: 6px; flex-shrink: 0; border-radius: 50%; background: currentColor; }
    .status[data-state="running"], .status[data-state="succeeded"], .status[data-state="success"] { background: #ecfdf5; border-color: #a7f3d0; color: #047857; }
    .status[data-state="exited"], .status[data-state="stopped"] { background: #f1f5f9; border-color: #cbd5e1; color: #475569; }
    .status[data-state="error"], .status[data-state="dead"], .status[data-state="failed"] { background: #fef2f2; border-color: #fecaca; color: #b91c1c; }
    .status[data-state="paused"], .status[data-state="restarting"] { background: #fffbeb; border-color: #fde68a; color: #92400e; }

    pre {
      min-height: 160px;
      max-height: 480px;
      margin: 0;
      padding: 20px 24px;
      overflow: auto;
      background: #f8fafc;
      color: #334155;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 13px;
      line-height: 1.7;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    @media (max-width: 640px) {
      body { padding: 24px 16px 32px; }
      h1 { font-size: 28px; }
      body > p { margin-bottom: 24px; }
      form { grid-template-columns: 1fr; gap: 16px; padding: 20px; }
      .apps { grid-template-columns: minmax(0, 1fr); gap: 16px; margin-top: 24px; }
      article { padding: 20px; }
      pre { padding: 16px; }
    }
    @media (prefers-reduced-motion: reduce) {
      input, button { transition: none; }
    }
  </style>
</head>
<body>
  <h1>Applications</h1>
  <p>Register and manage Docker applications from one control plane.</p>

  <h2>Deploy New App</h2>
  <form id="new-app">
    <label>Name <input name="name" required placeholder="My App"></label>
    <label>Docker image <input name="image" required placeholder="my-app:latest"></label>
    <label>Container name <input name="containerName" required placeholder="my-app"></label>
    <label>Container port <input name="containerPort" type="number" min="1" max="65535" required value="3000"></label>
    <label>Host port <input name="hostPort" type="number" min="1" max="65535" required value="3001"></label>
    <button type="submit">Deploy App</button>
  </form>

  <h2>Deploy from GitHub</h2>
  <form id="github-app">
    <label>Application name <input name="name" required maxlength="100" placeholder="My GitHub App"></label>
    <label>Public GitHub repository URL <input name="repositoryUrl" type="url" required placeholder="https://github.com/owner/repository"></label>
    <label>Branch <input name="branch" value="main" required></label>
    <label>Container port <input name="containerPort" type="number" min="1" max="65535" required value="3000"></label>
    <label>Host port <input name="hostPort" type="number" min="1" max="65535" required value="3005"></label>
    <button type="submit">Deploy from GitHub</button>
  </form>

  <div id="apps" class="apps"></div>
  <h2>Output</h2>
  <pre id="output">Ready.</pre>

  <script>
    const apps = document.querySelector("#apps");
    const output = document.querySelector("#output");

    async function request(path, options = {}) {
      const response = await fetch(path, options);
      const body = await response.json();
      if (!response.ok) throw new Error(body.error || `HTTP ${response.status}`);
      return body;
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>'"]/g, character => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;" })[character]);
    }

    async function loadApps() {
      const applications = await request("/api/apps");
      apps.innerHTML = applications.map(app => `
        <article data-id="${escapeHtml(app.id)}">
          <h3>${escapeHtml(app.name)}</h3>
          <div class="meta">
            Image: <code>${escapeHtml(app.image)}</code><br>
            ${app.repositoryUrl ? `Repository: <code>${escapeHtml(app.repositoryUrl)}</code><br>Branch: ${escapeHtml(app.branch)}<br>` : ""}
            Container: <code>${escapeHtml(app.containerName)}</code><br>
            Port: ${app.hostPort} &rarr; ${app.containerPort}<br>
            Status: <span class="status" data-state="${escapeHtml(app.status)}">${escapeHtml(app.status)}</span>
          </div>
          <p class="actions">
            <button data-action="deploy">Deploy</button>
            <button data-action="stop">Stop</button>
            <button data-action="restart">Restart</button>
            <button data-action="status" data-method="GET">Status</button>
            <button data-action="logs" data-method="GET">Logs</button>
            <button data-open>Open Application</button>
            <button data-delete>Delete</button>
          </p>
        </article>`).join("") || "<p>No applications registered.</p>";
    }

    apps.addEventListener("click", async event => {
      const button = event.target.closest("button");
      if (!button) return;
      const card = button.closest("article");
      const id = encodeURIComponent(card.dataset.id);
      output.textContent = "Working...";
      try {
        if (button.hasAttribute("data-open")) {
          const application = (await request(`/api/apps/${id}`));
          window.open(`http://localhost:${application.hostPort}`, "_blank", "noopener");
          output.textContent = `Opened ${application.name}.`;
          return;
        }
        if (button.hasAttribute("data-delete")) {
          if (!confirm("Stop and permanently remove this container and unregister the app?")) return;
          output.textContent = JSON.stringify(await request(`/api/apps/${id}`, { method: "DELETE" }), null, 2);
        } else {
          const result = await request(`/api/apps/${id}/${button.dataset.action}`, { method: button.dataset.method || "POST" });
          output.textContent = result.logs ?? JSON.stringify(result, null, 2);
        }
        await loadApps();
      } catch (error) { output.textContent = `Error: ${error.message}`; }
    });

    document.querySelector("#new-app").addEventListener("submit", async event => {
      event.preventDefault();
      output.textContent = "Registering and deploying...";
      const data = Object.fromEntries(new FormData(event.target));
      data.containerPort = Number(data.containerPort);
      data.hostPort = Number(data.hostPort);
      try {
        const application = await request("/api/apps", {
          method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(data)
        });
        const result = await request(`/api/apps/${encodeURIComponent(application.id)}/deploy`, { method: "POST" });
        output.textContent = JSON.stringify(result, null, 2);
        event.target.reset();
        await loadApps();
      } catch (error) {
        output.textContent = `Error: ${error.message}`;
        await loadApps();
      }
    });

    document.querySelector("#github-app").addEventListener("submit", async event => {
      event.preventDefault();
      const form = event.target;
      const button = form.querySelector('button[type="submit"]');
      if (button.disabled) return;
      button.disabled = true;
      output.textContent = "Cloning repository, building Docker image, and starting container. This may take several minutes...";
      const data = Object.fromEntries(new FormData(form));
      data.containerPort = Number(data.containerPort);
      data.hostPort = Number(data.hostPort);
      try {
        const result = await request("/api/deploy/github", {
          method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(data)
        });
        output.textContent = JSON.stringify(result, null, 2);
        form.reset();
        await loadApps();
      } catch (error) {
        output.textContent = `Error: ${error.message}`;
      } finally { button.disabled = false; }
    });

    loadApps().catch(error => { output.textContent = `Error: ${error.message}`; });
  </script>
</body>
</html>
